name: Feature request
description: Suggest an improvement to the installer, harness, workflow, or integrations.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Explain the problem first; the proposed solution is easier to evaluate when the motivation is clear.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation or workflow problem are you trying to solve?
      placeholder: I want to ... but the harness currently ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, API, command, or documentation you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or prior art.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer or npm package
        - Harness lifecycle or workflow
        - Blender or MCP operations
        - Skills, agents, or prompts
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, screenshots, or related issues.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and release notes.
          required: true
        - label: This request is about the harness, not a Blender feature request.
          required: false
